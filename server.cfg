// ============================================================
// Arma 3 dedicated server config — Antistasi
// Reference: https://community.bistudio.com/wiki/Arma_3:_Server_Config_File
// ============================================================

hostname        = "Antistasi Dedicated";
password        = "";              // password to join the server (empty = public)
passwordAdmin   = "changeme";      // RCON / #login password — CHANGE THIS

motd[]          = { "Antistasi server", "Have fun." };
motdInterval    = 5;

maxPlayers      = 20;
persistent      = 1;
verifySignatures = 2;
allowedFilePatching = 1;           // Antistasi requires this for headless / debug
disableVoN      = 0;
vonCodecQuality = 10;

logFile         = "server.log";
voteMissionPlayers = 1;
voteThreshold      = 0.33;

kickDuplicate   = 1;
upnp            = 0;
loopback        = 0;

// BattlEye
battlEye        = 1;

// ---------- mission cycle ----------
class Missions {
    class Antistasi_Altis {
        template   = "Antistasi_Altis.Altis";
        difficulty = "Regular";
        class Params {
            autoLoadLastGame    = 60;
            LogLevel            = 2;
            A3A_logDebugConsole = 1;
        };
    };
};
