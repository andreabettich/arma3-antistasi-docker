// ============================================================
// Arma 3 dedicated server config — Antistasi
// Reference: https://community.bistudio.com/wiki/Arma_3:_Server_Config_File
//
// This file is rendered through `envsubst` by the entrypoint on every boot.
// `${VAR}` placeholders are filled from .env / docker-compose env. Anything
// without `${...}` is kept verbatim. Output lands at
// /arma3/configs/server.cfg inside the container.
// ============================================================

hostname        = "${SERVER_HOSTNAME}";
password        = "${SERVER_PASSWORD}";   // empty = public server
passwordAdmin   = "${ADMIN_PASSWORD}";    // RCON / in-game `#login <pwd>`

motd[]          = { "${SERVER_HOSTNAME}", "Have fun." };
motdInterval    = 5;

maxPlayers      = ${MAX_PLAYERS};
persistent      = 1;
verifySignatures = 2;
allowedFilePatching = 1;           // Antistasi requires this for headless / debug
disableVoN      = 0;
vonCodecQuality = 10;

logFile         = "server.log";
voteMissionPlayers = 1;
voteThreshold      = 0.33;

kickDuplicate   = 1;
upnp            = 0;
loopback        = 0;

// BattlEye
battlEye        = 1;

// ---------- mission cycle ----------
class Missions {
    class Antistasi {
        template   = "${MISSION_TEMPLATE}";
        difficulty = "${MISSION_DIFFICULTY}";
        class Params {
            autoLoadLastGame    = 60;
            LogLevel            = 2;
            A3A_logDebugConsole = 1;
        };
    };
};
