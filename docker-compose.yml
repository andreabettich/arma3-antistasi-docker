services:
  arma3:
    build: .
    image: arma3-antistasi:latest
    container_name: arma3-antistasi
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ARMA_PORT: "2302"
      ARMA_PROFILE: "server"
      ARMA_LIMITFPS: "1000"
      ARMA_CONFIG: "server.cfg"
      ARMA_PARAMS: "-autoInit -loadMissionToMemory"
      # ---- server.cfg template values (rendered on every boot) ----
      SERVER_HOSTNAME: "${SERVER_HOSTNAME:-Antistasi Dedicated}"
      SERVER_PASSWORD: "${SERVER_PASSWORD:-}"     # empty = public
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      MISSION_TEMPLATE: "${MISSION_TEMPLATE:-Antistasi_Altis.Altis}"
      MISSION_DIFFICULTY: "${MISSION_DIFFICULTY:-Regular}"
      # Diagnostic / security knobs — flip to relax checks while debugging:
      BATTLEYE_ENABLE: "${BATTLEYE_ENABLE:-1}"          # 0 = disable BE
      VERIFY_SIGNATURES: "${VERIFY_SIGNATURES:-2}"      # 0 = off, 2 = enforce
      # REQUIRED for the Arma 3 dedicated server install — anonymous SteamCMD
      # login is rejected by Steam ("No subscription"). Use an account that
      # owns Arma 3. Same credentials are also used for Steam Workshop mod
      # downloads if SKIP_MOD_INSTALL is false and STEAM_USER is set.
      STEAM_USER: "${STEAM_USER}"
      STEAM_PASSWORD: "${STEAM_PASSWORD}"
      # Set to "true" after first install to skip SteamCMD update on every restart:
      SKIP_INSTALL: "false"
      SKIP_MOD_INSTALL: "false"
      # Force a one-shot re-install of every mod even if markers match:
      # FORCE_MOD_UPDATE: "true"
    ports:
      - "2302:2302/udp"
      - "2303:2303/udp"
      - "2304:2304/udp"
      - "2305:2305/udp"
      - "2306:2306/udp"
    volumes:
      - arma3-data:/arma3
      # Mod manifest. See mods.conf.example.
      - ./mods.conf:/mods.conf:ro
      # Local mod sources. Drop each mod under ./files/<name>/ (matching the
      # `local` rows in mods.conf, where <name> is the manifest's name field).
      - ./files:/mod-src:ro
      # Profile dir lives on the host so saves are easy to back up / replace.
      # The current Antistasi save lands at:
      #   ./profiles/home/${ARMA_PROFILE}/${ARMA_PROFILE}.vars.Arma3Profile
      - ./profiles:/arma3/configs/profiles
      # Optional: drop a .vars.Arma3Profile into ./saves/import to seed the
      # server with an existing save on the next start (only if no save yet).
      - ./saves:/saves

volumes:
  arma3-data:
